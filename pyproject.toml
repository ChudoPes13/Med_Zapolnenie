[project]
name = "medjarvis"
version = "0.1.0"
description = "Local realtime EMK quality assistant for Russian dental visits"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16.0",
    "ctranslate2==4.7.2",
    "fastapi>=0.115.12",
    "faster-whisper==1.2.1",
    "huggingface-hub>=0.32.0",
    "httpx>=0.28.0",
    "numpy>=2.1.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.9.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.20",
    "silero-vad==6.2.1",
    "sqlmodel>=0.0.24",
    "uvicorn[standard]>=0.34.0",
    "websockets>=15.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["frontend*", "tests*", "docs*", "scripts*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
